<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Afiq & Hafiy</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- LOADER -->

<div id="loader">

<div class="loader-box">

<div class="loader-ring"></div>

<h3>Memuatkan Undangan...</h3>

</div>

</div>

<!-- COVER -->

<div id="cover">

<img
id="envelope"
src="images/cover.jpg"
alt="Cover">

</div>

<!-- WEBSITE -->

<div id="website">

<section class="page">

<img src="images/page1.jpg" alt="Page 1">

</section>

<section class="page">

<img src="images/page2.jpg" alt="Page 2">

</section>

<section class="page">

<img src="images/page3.jpg" alt="Page 3">

</section>

<section class="page">

<img src="images/page4.jpg" alt="Page 4">

</section>

<section class="page">

<img src="images/page5.jpg" alt="Page 5">

</section>

<section class="page fade-section" id="countdown">

<img src="images/page6.jpg" alt="Page 6">

<div class="countdown-overlay">

    <div class="count-box">
        <span id="days">00</span>
    </div>

    <div class="count-box">
        <span id="hours">00</span>
    </div>

    <div class="count-box">
        <span id="minutes">00</span>
    </div>

    <div class="count-box">
        <span id="seconds">00</span>
    </div>

</div>

</section>

<section class="page fade-section">

<img src="images/page7.jpg" alt="Page 7">

</section>

<section class="page">

<img src="images/page8.jpg" alt="Page 8">

</section>

</div>

<div id="sheetOverlay"></div>

<div id="bottomSheet">

    <div id="sheetHandle"></div>

    <div id="sheetContent"></div>

</div>

<audio id="music" loop>

<source src="music/lagu.mp3" type="audio/mp3">

</audio>

<button id="musicBtn">

<i class="fa-solid fa-music"></i>

</button>

<!-- BOTTOM NAVIGATION -->

<nav id="bottomNav" style="display:none;">

<button id="dateBtn">
<i class="fa-solid fa-calendar-days"></i>
<span>Tarikh</span>
</button>

<button id="locationBtn">
<i class="fa-solid fa-location-dot"></i>
<span>Lokasi</span>
</button>

<button id="contactBtn">
<i class="fa-solid fa-phone"></i>
<span>Hubungi</span>
</button>

<button id="rsvpBtn">
<i class="fa-solid fa-envelope-open-text"></i>
<span>RSVP</span>
</button>

<button id="wishBtn">
<i class="fa-solid fa-heart"></i>
<span>Ucapan</span>
</button>

<button id="shareBtn">
<i class="fa-solid fa-share-nodes"></i>
<span>Kongsi</span>
</button>

</nav>

<!-- BOTTOM SHEET -->

<script type="module" src="firebase.js"></script>
<script type="module" src="script.js"></script>

</body>
</html>
